<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Room · StudyBuddy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ══════════════ ROOM-SPECIFIC STYLES ══════════════ */
    :root {
      --focus-color: #6C63FF;
      --break-color: #48CAE4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark, #0F0E17);
      color: var(--text, #EFEFEF);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Navbar ── */
    .room-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(26,26,46,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 1rem;
    }

    .room-navbar .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text, #EFEFEF);
      text-decoration: none;
      white-space: nowrap;
    }

    .room-navbar .session-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted, #9A9AB0);
      flex: 1;
      justify-content: center;
      text-align: center;
    }

    .room-navbar .session-info .buddy-name {
      color: var(--break-color);
      font-weight: 600;
    }

    .room-navbar .online-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2DC653;
      display: inline-block;
      box-shadow: 0 0 6px #2DC653;
    }

    .btn-leave {
      background: rgba(247,37,133,0.15);
      border: 1px solid rgba(247,37,133,0.4);
      color: #F72585;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-leave:hover {
      background: rgba(247,37,133,0.3);
    }

    /* ── Room Layout ── */
    .room-layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 57px);
      overflow: hidden;
    }

    /* ── Panel base ── */
    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      position: relative;
      transition: width 0.3s ease;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .panel-toggle {
      background: none;
      border: none;
      color: var(--text-muted, #9A9AB0);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    .panel-toggle:hover { color: var(--text, #EFEFEF); background: rgba(255,255,255,0.08); }

    /* ════════════ POMODORO (CENTER) ════════════ */
    .panel-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      border-right: 1px solid rgba(255,255,255,0.07);
      overflow-y: auto;
      background: rgba(255,255,255,0.01);
    }

    .pomodoro-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 1rem;
      width: 100%;
      gap: 1.25rem;
    }

    .pomo-mode {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .pomo-session {
      font-size: 0.8rem;
      color: var(--text-muted, #9A9AB0);
      margin-top: -0.75rem;
    }

    /* SVG ring */
    .pomo-ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      flex-shrink: 0;
    }

    .pomo-svg {
      width: 220px;
      height: 220px;
      transform: rotate(-90deg);
    }

    .pomo-bg-circle {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 12;
    }

    .pomo-progress-circle {
      fill: none;
      stroke: var(--focus-color);
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    }

    .pomo-time-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
    }

    .pomo-time {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .pomo-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted, #9A9AB0);
    }

    /* Controls */
    .pomo-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pomo-btn {
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    .pomo-btn-main {
      width: 56px; height: 56px;
      background: var(--focus-color);
      color: #fff;
      font-size: 1.3rem;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }
    .pomo-btn-main:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(108,99,255,0.6); }

    .pomo-btn-sm {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.08);
      color: var(--text, #EFEFEF);
    }
    .pomo-btn-sm:hover { background: rgba(255,255,255,0.15); }

    /* Session dots */
    .pomo-sessions-dots {
      display: flex;
      gap: 0.5rem;
    }

    .session-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.3s;
    }
    .session-dot.done { background: var(--focus-color); }
    .session-dot.active { background: var(--focus-color); box-shadow: 0 0 8px var(--focus-color); }

    /* Settings gear */
    .pomo-settings-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding: 0 0.5rem;
    }

    .pomo-gear-btn {
      background: none;
      border: none;
      color: var(--text-muted, #9A9AB0);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
      border-radius: 6px;
      transition: color 0.2s, transform 0.3s;
    }
    .pomo-gear-btn:hover { color: var(--text, #EFEFEF); transform: rotate(45deg); }

    /* ════════════ TASK LIST (LEFT) ════════════ */
    .panel-left { overflow-y: auto; }

    .tasks-body {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
      flex: 1;
      overflow-y: auto;
    }

    .task-add-row {
      display: flex;
      gap: 0.5rem;
    }

    .task-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      color: var(--text, #EFEFEF);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .task-input:focus { border-color: var(--focus-color); }

    .btn-add-task {
      background: var(--focus-color);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    .btn-add-task:hover { opacity: 0.85; }

    .task-count {
      font-size: 0.8rem;
      color: var(--text-muted, #9A9AB0);
      text-align: right;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      cursor: grab;
      transition: background 0.2s, opacity 0.2s;
    }
    .task-item:active { cursor: grabbing; }
    .task-item.drag-over { border-color: var(--focus-color); background: rgba(108,99,255,0.12); }
    .task-item.completed { opacity: 0.5; }

    .task-checkbox {
      width: 18px; height: 18px;
      accent-color: var(--focus-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.875rem;
      word-break: break-word;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted, #9A9AB0);
    }

    .task-delete {
      background: none;
      border: none;
      color: rgba(247,37,133,0.5);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.1rem 0.25rem;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .task-delete:hover { color: #F72585; }

    /* Completed section */
    .completed-toggle {
      background: none;
      border: none;
      color: var(--text-muted, #9A9AB0);
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0;
      transition: color 0.2s;
      width: 100%;
      text-align: left;
    }
    .completed-toggle:hover { color: var(--text, #EFEFEF); }
    .completed-toggle .caret { transition: transform 0.2s; }
    .completed-toggle.open .caret { transform: rotate(90deg); }

    .completed-list {
      display: none;
    }
    .completed-list.open { display: flex; flex-direction: column; gap: 0.4rem; }

    /* ════════════ CHAT (RIGHT) ════════════ */
    .panel-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      max-width: 85%;
    }

    .chat-msg.mine {
      align-self: flex-end;
      align-items: flex-end;
    }
    .chat-msg.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .chat-msg-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--text-muted, #9A9AB0);
    }

    .chat-avatar-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .avatar-mine { background: var(--focus-color); }
    .avatar-theirs { background: #48CAE4; }

    .chat-bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble-mine {
      background: var(--focus-color);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble-theirs {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text, #EFEFEF);
      border-bottom-left-radius: 4px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted, #9A9AB0);
      padding: 0 0.25rem;
    }
    .typing-indicator.visible { display: flex; }

    .typing-dots {
      display: flex; gap: 3px;
    }
    .typing-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-muted, #9A9AB0);
      animation: typingDot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Chat input */
    .chat-input-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 0.55rem 1rem;
      color: var(--text, #EFEFEF);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    .chat-input:focus { border-color: var(--break-color); }

    .btn-send {
      background: var(--focus-color);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .btn-send:hover { opacity: 0.85; transform: scale(1.08); }

    /* ════════════ MODALS ════════════ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #1A1A2E;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 1.5rem;
      width: min(400px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .modal-row label {
      font-size: 0.8rem;
      color: var(--text-muted, #9A9AB0);
      font-weight: 500;
    }

    .modal-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: var(--text, #EFEFEF);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--focus-color); }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .btn-modal-cancel {
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text, #EFEFEF);
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .btn-modal-cancel:hover { background: rgba(255,255,255,0.14); }

    .btn-modal-save {
      background: var(--focus-color);
      border: none;
      color: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    .btn-modal-save:hover { opacity: 0.85; }

    /* ════════════ TOAST ════════════ */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      z-index: 9999;
    }

    .toast {
      background: rgba(26,26,46,0.97);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 0.7rem 1.4rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text, #EFEFEF);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-8px); }
    }

    /* ════════════ MOBILE TABS ════════════ */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(26,26,46,0.98);
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 200;
    }

    .tab-bar-inner {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.6rem 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted, #9A9AB0);
      cursor: pointer;
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      transition: color 0.2s;
    }
    .tab-btn i { font-size: 1.1rem; }
    .tab-btn.active { color: var(--focus-color); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .room-layout {
        grid-template-columns: 1fr;
        height: calc(100vh - 57px - 56px);
        overflow: hidden;
      }

      .panel {
        display: none;
        border-right: none;
        height: 100%;
        overflow-y: auto;
      }
      .panel.mobile-active { display: flex; }

      .panel-toggle { display: none; }
      .mobile-tab-bar { display: block; }

      .pomo-ring-wrap { width: 240px; height: 240px; }
      .pomo-svg { width: 240px; height: 240px; }
      .pomo-time { font-size: 2.8rem; }
    }

    @media (max-width: 600px) {
      .room-navbar .session-info { display: none; }
    }

    /* Collapsible panels on desktop */
    .panel.collapsed {
      grid-column: unset;
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="room-navbar">
    <a href="index.html" class="logo">📚 StudyBuddy</a>
    <div class="session-info">
      <span class="online-dot"></span>
      <span>Studying with <span class="buddy-name" id="navBuddyName">your buddy</span></span>
    </div>
    <button class="btn-leave" onclick="window.location.href='dashboard.html'">
      <i class="fas fa-door-open"></i> Leave Room
    </button>
  </nav>

  <!-- ══ ROOM LAYOUT ══ -->
  <div class="room-layout" id="roomLayout">

    <!-- ═══ LEFT — TASK CHECKLIST ═══ -->
    <div class="panel panel-left mobile-active" id="panelTasks" data-panel="tasks">
      <div class="panel-header">
        <h2>📋 My Tasks</h2>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <span class="task-count" id="taskCount">0 of 0 done</span>
          <button class="panel-toggle" title="Collapse" onclick="togglePanel('tasks')"><i class="fas fa-chevron-left"></i></button>
        </div>
      </div>
      <div class="tasks-body">
        <!-- Add task row -->
        <div class="task-add-row">
          <input class="task-input" id="taskInput" type="text" placeholder="Add a new task…" maxlength="150" />
          <button class="btn-add-task" onclick="addTask()">Add</button>
        </div>
        <!-- Active tasks -->
        <ul class="task-list" id="activeTaskList"></ul>
        <!-- Completed section -->
        <button class="completed-toggle" id="completedToggle" onclick="toggleCompleted()">
          <i class="fas fa-chevron-right caret"></i>
          <span id="completedLabel">✓ Completed (0)</span>
        </button>
        <ul class="task-list completed-list" id="completedList"></ul>
      </div>
    </div>

    <!-- ═══ CENTER — POMODORO ═══ -->
    <div class="panel panel-center mobile-active" id="panelTimer" data-panel="timer">
      <div class="panel-header" style="width:100%;justify-content:center;position:relative;">
        <h2 style="justify-content:center;">⏱ Pomodoro Timer</h2>
        <button class="pomo-gear-btn" title="Settings" onclick="openSettings()" style="position:absolute;right:1rem;">
          <i class="fas fa-gear"></i>
        </button>
      </div>
      <div class="pomodoro-wrapper">
        <div class="pomo-mode" id="pomoMode">🍅 Focus</div>
        <div class="pomo-session" id="pomoSession">Session 1 of 4</div>

        <!-- SVG ring -->
        <div class="pomo-ring-wrap">
          <svg class="pomo-svg" viewBox="0 0 220 220">
            <circle class="pomo-bg-circle" cx="110" cy="110" r="96" />
            <circle class="pomo-progress-circle" id="pomoRing" cx="110" cy="110" r="96"
              stroke-dasharray="603.19" stroke-dashoffset="0" />
          </svg>
          <div class="pomo-time-display">
            <div class="pomo-time" id="pomoTime">25:00</div>
            <div class="pomo-label" id="pomoPhaseLabel">FOCUS</div>
          </div>
        </div>

        <!-- Session dots -->
        <div class="pomo-sessions-dots" id="sessionDots">
          <div class="session-dot active" data-dot="0"></div>
          <div class="session-dot" data-dot="1"></div>
          <div class="session-dot" data-dot="2"></div>
          <div class="session-dot" data-dot="3"></div>
        </div>

        <!-- Controls -->
        <div class="pomo-controls">
          <button class="pomo-btn pomo-btn-sm" title="Reset" onclick="pomoReset()">
            <i class="fas fa-rotate-left"></i>
          </button>
          <button class="pomo-btn pomo-btn-main" id="pomoPlayBtn" onclick="pomoToggle()">
            <i class="fas fa-play"></i>
          </button>
          <button class="pomo-btn pomo-btn-sm" title="Skip" onclick="pomoSkip()">
            <i class="fas fa-forward-step"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ RIGHT — CHAT ═══ -->
    <div class="panel panel-right" id="panelChat" data-panel="chat">
      <div class="panel-header">
        <button class="panel-toggle" title="Collapse" onclick="togglePanel('chat')"><i class="fas fa-chevron-right"></i></button>
        <h2>💬 Session Chat</h2>
        <div style="width:28px;"></div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <!-- messages injected by JS -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span id="typingText">Buddy is typing…</span>
        </div>
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chatInput" type="text" placeholder="Type a message…" maxlength="500" />
        <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- ══ MOBILE TAB BAR ══ -->
  <div class="mobile-tab-bar" id="mobileTabBar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">
        <i class="fas fa-list-check"></i>Tasks
      </button>
      <button class="tab-btn active" id="tab-timer" onclick="switchTab('timer')">
        <i class="fas fa-clock"></i>Timer
      </button>
      <button class="tab-btn" id="tab-chat" onclick="switchTab('chat')">
        <i class="fas fa-comments"></i>Chat
      </button>
    </div>
  </div>

  <!-- ══ SETTINGS MODAL ══ -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h3>⚙️ Timer Settings</h3>
      <div class="modal-row">
        <label>🍅 Focus Duration (minutes)</label>
        <input class="modal-input" id="settingFocus" type="number" min="1" max="60" value="25" />
      </div>
      <div class="modal-row">
        <label>☕ Short Break (minutes)</label>
        <input class="modal-input" id="settingBreak" type="number" min="1" max="30" value="5" />
      </div>
      <div class="modal-row">
        <label>🌙 Long Break (minutes)</label>
        <input class="modal-input" id="settingLongBreak" type="number" min="1" max="60" value="15" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-modal-save" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <!-- ══ TOAST CONTAINER ══ -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ══ SCRIPTS ══ -->
  <script src="js/app.js"></script>
  <script>
  (function () {
    'use strict';

    /* ─────────────────────────── BUDDY INFO ─────────────────────────── */
    const params = new URLSearchParams(window.location.search);
    const buddyId = params.get('buddy');
    let buddy = null;

    function initBuddy() {
      if (window.StudyBuddy && StudyBuddy.buddies) {
        buddy = StudyBuddy.buddies.find(b => b.id === buddyId) || StudyBuddy.buddies[0];
      } else {
        buddy = { id: 'default', name: 'Alex', avatar: 'https://ui-avatars.com/api/?name=Alex&background=48CAE4&color=fff&size=80' };
      }
      document.getElementById('navBuddyName').textContent = buddy.name;
      document.title = `Studying with ${buddy.name} · StudyBuddy`;
      document.getElementById('typingText').textContent = `${buddy.name} is typing…`;
    }

    /* ─────────────────────────── TOAST ─────────────────────────── */
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    window.showToast = showToast;

    /* ─────────────────────────── BEEP ─────────────────────────── */
    function playBeep() {
      if (!document.hasFocus()) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) { /* silence */ }
    }

    /* ─────────────────────────── POMODORO ─────────────────────────── */
    const CIRCUMFERENCE = 2 * Math.PI * 96; // 603.19

    let pomoSettings = {
      focus: 25,
      shortBreak: 5,
      longBreak: 15
    };

    // phases: 'focus' | 'shortBreak' | 'longBreak'
    let pomoState = {
      phase: 'focus',
      sessionNum: 1,          // 1-4
      totalFocusDone: 0,
      running: false,
      secondsLeft: 0,
      totalSeconds: 0,
      interval: null
    };

    const ringEl    = document.getElementById('pomoRing');
    const timeEl    = document.getElementById('pomoTime');
    const modeEl    = document.getElementById('pomoMode');
    const sessionEl = document.getElementById('pomoSession');
    const playBtn   = document.getElementById('pomoPlayBtn');
    const phaseLbl  = document.getElementById('pomoPhaseLabel');
    const dots      = document.querySelectorAll('.session-dot');

    function pomoPhaseSeconds(phase) {
      if (phase === 'focus')      return pomoSettings.focus      * 60;
      if (phase === 'shortBreak') return pomoSettings.shortBreak * 60;
      return pomoSettings.longBreak * 60;
    }

    function pomoFormatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function pomoUpdateUI() {
      // time display
      timeEl.textContent = pomoFormatTime(pomoState.secondsLeft);

      // ring progress
      const pct = pomoState.secondsLeft / pomoState.totalSeconds;
      const offset = CIRCUMFERENCE * (1 - pct);
      ringEl.style.strokeDashoffset = offset;

      // phase color
      const isFocus = pomoState.phase === 'focus';
      ringEl.style.stroke = isFocus ? 'var(--focus-color)' : 'var(--break-color)';

      // mode text
      if (pomoState.phase === 'focus') {
        modeEl.textContent = '🍅 Focus';
        phaseLbl.textContent = 'FOCUS';
      } else if (pomoState.phase === 'shortBreak') {
        modeEl.textContent = '☕ Break';
        phaseLbl.textContent = 'SHORT BREAK';
      } else {
        modeEl.textContent = '🌙 Long Break';
        phaseLbl.textContent = 'LONG BREAK';
      }

      // session indicator
      sessionEl.textContent = `Session ${pomoState.sessionNum} of 4`;

      // dots
      dots.forEach((dot, i) => {
        dot.classList.remove('active', 'done');
        if (i < pomoState.totalFocusDone) dot.classList.add('done');
        if (i === pomoState.sessionNum - 1 && pomoState.phase === 'focus') dot.classList.add('active');
      });

      // play/pause icon
      playBtn.innerHTML = pomoState.running
        ? '<i class="fas fa-pause"></i>'
        : '<i class="fas fa-play"></i>';

      // main btn color
      playBtn.style.background = isFocus ? 'var(--focus-color)' : 'var(--break-color)';
    }

    function pomoInitPhase(phase) {
      pomoState.phase = phase;
      pomoState.secondsLeft = pomoPhaseSeconds(phase);
      pomoState.totalSeconds = pomoState.secondsLeft;
      pomoState.running = false;
      clearInterval(pomoState.interval);
      pomoUpdateUI();
    }

    function pomoTick() {
      if (pomoState.secondsLeft <= 0) {
        clearInterval(pomoState.interval);
        pomoState.running = false;
        playBeep();
        // advance phase
        if (pomoState.phase === 'focus') {
          pomoState.totalFocusDone = Math.min(pomoState.totalFocusDone + 1, 4);
          if (pomoState.totalFocusDone >= 4 && pomoState.sessionNum === 4) {
            showToast('🌙 Long break time! Great work!');
            pomoInitPhase('longBreak');
          } else {
            showToast('☕ Short break time! Relax a bit.');
            pomoInitPhase('shortBreak');
          }
        } else {
          // after any break → next focus session
          if (pomoState.sessionNum < 4) {
            pomoState.sessionNum++;
          } else {
            // reset cycle
            pomoState.sessionNum = 1;
            pomoState.totalFocusDone = 0;
            showToast('🎉 Pomodoro cycle complete! Starting fresh.');
          }
          showToast('🍅 Focus time! Let\'s go!');
          pomoInitPhase('focus');
        }
        return;
      }
      pomoState.secondsLeft--;
      pomoUpdateUI();
    }

    window.pomoToggle = function () {
      if (pomoState.running) {
        clearInterval(pomoState.interval);
        pomoState.running = false;
        pomoUpdateUI();
      } else {
        pomoState.running = true;
        pomoState.interval = setInterval(pomoTick, 1000);
        pomoUpdateUI();
      }
    };

    window.pomoReset = function () {
      clearInterval(pomoState.interval);
      pomoState.running = false;
      pomoState.secondsLeft = pomoState.totalSeconds;
      pomoUpdateUI();
    };

    window.pomoSkip = function () {
      clearInterval(pomoState.interval);
      pomoState.running = false;
      if (pomoState.phase === 'focus') {
        pomoState.totalFocusDone = Math.min(pomoState.totalFocusDone + 1, 4);
        if (pomoState.totalFocusDone >= 4) {
          pomoInitPhase('longBreak');
        } else {
          pomoInitPhase('shortBreak');
        }
      } else {
        if (pomoState.sessionNum < 4) pomoState.sessionNum++;
        else { pomoState.sessionNum = 1; pomoState.totalFocusDone = 0; }
        pomoInitPhase('focus');
      }
    };

    window.openSettings = function () {
      document.getElementById('settingFocus').value     = pomoSettings.focus;
      document.getElementById('settingBreak').value     = pomoSettings.shortBreak;
      document.getElementById('settingLongBreak').value = pomoSettings.longBreak;
      document.getElementById('settingsModal').classList.add('open');
    };

    window.closeSettings = function () {
      document.getElementById('settingsModal').classList.remove('open');
    };

    window.saveSettings = function () {
      const f  = parseInt(document.getElementById('settingFocus').value)     || 25;
      const b  = parseInt(document.getElementById('settingBreak').value)      || 5;
      const lb = parseInt(document.getElementById('settingLongBreak').value)  || 15;
      pomoSettings.focus = Math.min(60, Math.max(1, f));
      pomoSettings.shortBreak = Math.min(30, Math.max(1, b));
      pomoSettings.longBreak  = Math.min(60, Math.max(1, lb));
      clearInterval(pomoState.interval);
      pomoState.running = false;
      pomoState.sessionNum = 1;
      pomoState.totalFocusDone = 0;
      pomoInitPhase('focus');
      closeSettings();
      showToast('⚙️ Timer settings saved!');
    };

    // init pomodoro
    pomoInitPhase('focus');

    /* ─────────────────────────── TASKS ─────────────────────────── */
    const TASK_KEY = 'study_tasks';
    let tasks = [];
    let dragSrcIdx = null;

    function loadTasks() {
      try {
        tasks = JSON.parse(localStorage.getItem(TASK_KEY)) || [];
      } catch (e) { tasks = []; }
    }

    function saveTasks() {
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      const active    = tasks.filter(t => !t.done);
      const completed = tasks.filter(t => t.done);

      const activeList    = document.getElementById('activeTaskList');
      const completedList = document.getElementById('completedList');
      const countEl       = document.getElementById('taskCount');
      const completedLbl  = document.getElementById('completedLabel');

      activeList.innerHTML    = '';
      completedList.innerHTML = '';

      countEl.textContent = `${completed.length} of ${tasks.length} done`;
      completedLbl.textContent = `✓ Completed (${completed.length})`;

      active.forEach((task, idx) => {
        activeList.appendChild(buildTaskEl(task, idx, false));
      });

      completed.forEach((task, idx) => {
        completedList.appendChild(buildTaskEl(task, idx, true));
      });
    }

    function buildTaskEl(task, _idx, isDone) {
      const li = document.createElement('li');
      li.className = 'task-item' + (isDone ? ' completed' : '');
      li.draggable = !isDone;
      li.dataset.id = task.id;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'task-checkbox';
      cb.checked = task.done;
      cb.addEventListener('change', () => {
        const t = tasks.find(x => x.id === task.id);
        if (t) { t.done = cb.checked; saveTasks(); renderTasks(); }
      });

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.innerHTML = '🗑';
      del.title = 'Delete task';
      del.addEventListener('click', () => {
        tasks = tasks.filter(x => x.id !== task.id);
        saveTasks(); renderTasks();
      });

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(del);

      // Drag events (active tasks only)
      if (!isDone) {
        li.addEventListener('dragstart', e => {
          dragSrcIdx = tasks.indexOf(tasks.find(x => x.id === task.id));
          e.dataTransfer.effectAllowed = 'move';
        });
        li.addEventListener('dragover', e => {
          e.preventDefault();
          li.classList.add('drag-over');
        });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', e => {
          e.preventDefault();
          li.classList.remove('drag-over');
          const destIdx = tasks.indexOf(tasks.find(x => x.id === task.id));
          if (dragSrcIdx !== null && dragSrcIdx !== destIdx) {
            const [moved] = tasks.splice(dragSrcIdx, 1);
            tasks.splice(destIdx, 0, moved);
            saveTasks(); renderTasks();
          }
          dragSrcIdx = null;
        });
        li.addEventListener('dragend', () => {
          document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
        });
      }

      return li;
    }

    window.addTask = function () {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text, done: false });
      input.value = '';
      saveTasks(); renderTasks();
    };

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.addTask();
    });

    let completedOpen = false;
    window.toggleCompleted = function () {
      completedOpen = !completedOpen;
      const toggle = document.getElementById('completedToggle');
      const list   = document.getElementById('completedList');
      toggle.classList.toggle('open', completedOpen);
      list.classList.toggle('open', completedOpen);
    };

    loadTasks();
    renderTasks();

    /* ─────────────────────────── CHAT ─────────────────────────── */
    const AUTO_REPLIES = [
      "Let's keep it up! You're doing great 💪",
      "Take a short break if you need — focus returns after rest 🧘",
      "I just finished a practice problem set. How about you?",
      "Pomodoro technique is really helping me concentrate today!",
      "Have you tried the Feynman technique? Explain it like you're teaching someone else.",
      "Coffee break? ☕ Just kidding — back to books!"
    ];
    let replyIdx = 0;

    const INITIAL_MSGS = [
      "Hey! Ready to study? 📖",
      "I'm starting with revision — let's both set a goal for this session!",
      "Feel free to use the Pomodoro timer. I find 25-min sessions super effective.",
      "Ping me if you want to compare notes 🤝"
    ];

    function getTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function appendMsg(text, fromBuddy, name, avatarLetter) {
      const container = document.getElementById('chatMessages');
      const typingEl  = document.getElementById('typingIndicator');

      const wrap = document.createElement('div');
      wrap.className = `chat-msg ${fromBuddy ? 'theirs' : 'mine'}`;

      const meta = document.createElement('div');
      meta.className = 'chat-msg-meta';

      const avatarDot = document.createElement('div');
      avatarDot.className = `chat-avatar-dot ${fromBuddy ? 'avatar-theirs' : 'avatar-mine'}`;
      avatarDot.textContent = (avatarLetter || name || 'Y')[0].toUpperCase();

      const nameSpan = document.createElement('span');
      nameSpan.textContent = name;

      const timeSpan = document.createElement('span');
      timeSpan.textContent = getTime();

      if (fromBuddy) {
        meta.appendChild(avatarDot);
        meta.appendChild(nameSpan);
        meta.appendChild(timeSpan);
      } else {
        meta.appendChild(timeSpan);
        meta.appendChild(nameSpan);
        meta.appendChild(avatarDot);
      }

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${fromBuddy ? 'bubble-theirs' : 'bubble-mine'}`;
      bubble.textContent = text;

      wrap.appendChild(meta);
      wrap.appendChild(bubble);

      // insert before typing indicator
      container.insertBefore(wrap, typingEl);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping(show) {
      document.getElementById('typingIndicator').classList.toggle('visible', show);
      const container = document.getElementById('chatMessages');
      container.scrollTop = container.scrollHeight;
    }

    function buddyReply() {
      const delay = 1000 + Math.random() * 2000;
      showTyping(true);
      setTimeout(() => {
        showTyping(false);
        const msg = AUTO_REPLIES[replyIdx % AUTO_REPLIES.length];
        replyIdx++;
        const name = buddy ? buddy.name : 'Buddy';
        appendMsg(msg, true, name, name[0]);
      }, delay);
    }

    window.sendMessage = function () {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const profile = window.StudyBuddy ? StudyBuddy.getProfile() : null;
      const myName = (profile && profile.name) ? profile.name : 'You';

      appendMsg(text, false, myName, myName[0]);
      buddyReply();
    };

    document.getElementById('chatInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.sendMessage();
    });

    function initChat() {
      const name = buddy ? buddy.name : 'Buddy';
      const letter = name[0];
      INITIAL_MSGS.forEach((msg, i) => {
        setTimeout(() => appendMsg(msg, true, name, letter), i * 400);
      });
    }

    /* ─────────────────────────── PANEL COLLAPSE ─────────────────────────── */
    window.togglePanel = function (panel) {
      if (panel === 'tasks') {
        const el = document.getElementById('panelTasks');
        el.classList.toggle('collapsed');
      } else if (panel === 'chat') {
        const el = document.getElementById('panelChat');
        el.classList.toggle('collapsed');
      }
    };

    /* ─────────────────────────── MOBILE TABS ─────────────────────────── */
    window.switchTab = function (tab) {
      // Hide all panels on mobile
      ['panelTasks', 'panelTimer', 'panelChat'].forEach(id => {
        document.getElementById(id).classList.remove('mobile-active');
      });
      // Show selected
      const map = { tasks: 'panelTasks', timer: 'panelTimer', chat: 'panelChat' };
      document.getElementById(map[tab]).classList.add('mobile-active');
      // Update tab buttons
      ['tasks','timer','chat'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      });
    };

    // On mobile: default to timer view
    function handleMobile() {
      if (window.innerWidth <= 900) {
        switchTab('timer');
      }
    }
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) {
        ['panelTasks','panelTimer','panelChat'].forEach(id => {
          document.getElementById(id).classList.add('mobile-active');
        });
      }
    });

    /* ─────────────────────────── INIT ─────────────────────────── */
    initBuddy();
    initChat();
    handleMobile();

  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="A calm study space for your documents, notes, flashcards, quizzes, and focus sessions." />
  <title>Study Space — StudyBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/study.css" />
</head>
<body class="study-app">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="index.html" aria-label="StudyBuddy home"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span>study<span class="brand-dot">buddy</span></span></a>
      <div class="sidebar-caption">YOUR WORKSPACE</div>
      <nav class="side-nav" aria-label="Study space navigation">
        <button class="side-link is-active" data-view="overview"><i class="fa-solid fa-grid-2"></i><span>Overview</span></button>
        <button class="side-link" data-view="library"><i class="fa-regular fa-folder-open"></i><span>My library</span><span class="nav-count" id="library-count">0</span></button>
        <button class="side-link" data-view="flashcards"><i class="fa-regular fa-clone"></i><span>Flashcards</span></button>
        <button class="side-link" data-view="quiz"><i class="fa-regular fa-circle-question"></i><span>Practice quiz</span></button>
        <button class="side-link" data-view="notes"><i class="fa-regular fa-note-sticky"></i><span>My notes</span></button>
        <button class="side-link" data-view="focus"><i class="fa-regular fa-clock"></i><span>Focus timer</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="local-card"><span class="local-icon"><i class="fa-solid fa-shield-heart"></i></span><div><strong>Your files stay yours</strong><p>Extracted text is saved in this browser.</p></div></div>
      <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to StudyBuddy</a>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button>
        <div class="crumb"><span>My workspace</span><i class="fa-solid fa-chevron-right"></i><strong id="page-crumb">Overview</strong></div>
        <div class="topbar-right">
          <label class="global-search"><i class="fa-solid fa-magnifying-glass"></i><input id="global-search" type="search" placeholder="Search your library" aria-label="Search your library" /><kbd>Ctrl K</kbd></label>
          <a class="avatar" id="user-avatar" href="profile.html" aria-label="Your profile">S</a>
        </div>
      </header>
      <div id="view-content" class="view-content" aria-live="polite"></div>
      <footer class="app-footer"><span>Made for the way you learn.</span><span><i class="fa-solid fa-lock"></i> Private on this device</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="study-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><div class="eyebrow" id="modal-kicker">STUDY TOOL</div><h2 id="modal-title">Quick review</h2></div><button class="icon-button" id="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".pdf,.docx,.txt,.md,.markdown,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden />
  <script src="js/app.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
